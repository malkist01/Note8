name: Build FloppyKernel + XXKSU + NetHunter (ALL-IN-ONE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: floppy-unity

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache wget curl cpio patch

      - name: Fix script permissions
        run: |
          chmod +x build/ckbuild.sh
          chmod +x build/scripts/*.sh
          chmod +x build/lib/*.sh 2>/dev/null || true

      # ============================================
      # STEP 1: APPLY NETHUNTER PATCHES
      # ============================================
      - name: Clone & apply NetHunter patches (skip Samsung)
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel-builder.git ~/nethunter-patches
          cd ~/nethunter-patches/patches/4.14/
          
          for patch in $(ls *.patch | grep -viE 'samsung|oneui|hcionfig'); do
            echo "📌 Applying: $patch"
            patch -d $GITHUB_WORKSPACE -p1 < "$patch" 2>/dev/null || \
            patch -d $GITHUB_WORKSPACE -p0 < "$patch" 2>/dev/null || \
            echo "⚠️ $patch failed, skipped"
          done

      # ============================================
      # STEP 2: PATCH DROIDSPACES.CONFIG DENGAN SEMUA OPSI NETHUNTER
      # ============================================
      - name: Patch droidspaces.config dengan NetHunter options
        run: |
          echo "🔧 Menambahkan semua opsi NetHunter ke droidspaces.config..."
          
          cat >> arch/arm64/configs/droidspaces.config << 'EOF'
          
          # ==========================================
          # NETHUNTER FULL OPTIONS
          # ==========================================
          
          # ---- NETFILTER & FIREWALL ----
          CONFIG_NETFILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XT_MATCH=y
          CONFIG_IP_NF=y
          CONFIG_IP6_NF=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_IP_NF_NAT=y
          
          # ---- HID (DuckHunter) ----
          CONFIG_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_USB_HID=y
          CONFIG_USB_HIDDEV=y
          CONFIG_HID_GENERIC=y
          
          # ---- WIRELESS & INJECTION ----
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          CONFIG_ATH9K_HTC=y
          CONFIG_ATH9K_HTC_DEBUGFS=y
          CONFIG_RTL8188EU=y
          CONFIG_RTL8812AU=y
          CONFIG_RTL88XXAU=y
          
          # ---- BLUETOOTH ARSENAL ----
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_L2CAP=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_BCM=y
          CONFIG_BT_RTL=y
          CONFIG_BT_QCA=y
          CONFIG_BT_MTK=y
          CONFIG_BT_INTEL=y
          
          # ---- USB GADGET (USB Arsenal) ----
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_OBEX=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_PHONET=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_LB_SS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          
          # ---- ANDROID BINDER ----
          CONFIG_ANDROID_BINDER_IPC=y
          
          # ---- FILESYSTEMS ----
          CONFIG_NFS_FS=y
          CONFIG_NFS_V3=y
          CONFIG_NFS_V4=y
          CONFIG_CIFS=y
          CONFIG_FUSE_FS=y
          
          # ---- CARSENAL (CAN Bus) ----
          CONFIG_CAN=y
          CONFIG_CAN_RAW=y
          CONFIG_CAN_BCM=y
          CONFIG_CAN_GW=y
          CONFIG_CAN_VCAN=m
          CONFIG_CAN_SLCAN=m
          CONFIG_CAN_DEV=y
          CONFIG_CAN_CALC_BITTIMING=y
          
          # ---- BPF ----
          CONFIG_BPF_JIT=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          
          # ---- DISABLE SMACK ----
          # CONFIG_SECURITY_SMACK is not set
          
          # ---- DISABLE LTO & VDSO ----
          # CONFIG_LTO_CLANG is not set
          CONFIG_LTO_NONE=y
          # CONFIG_LTO is not set
          # CONFIG_VDSO is not set
          
          # ==========================================
          # END NETHUNTER OPTIONS
          # ==========================================
          EOF
          
          echo "✅ droidspaces.config berhasil di-patch!"

      # ============================================
      # STEP 3: BUILD DENGAN SCRIPT RESMI (SEMUA DALAM SATU SHELL)
      # ============================================
      - name: Build kernel dengan XXKSU + NetHunter
        run: |
          export WP=$(realpath $PWD/../)
          
          echo "🚀 Memulai build dengan XXKSU + NetHunter..."
          
          # Jalankan build resmi dengan XXKSU
          # Semua opsi NetHunter sudah ada di droidspaces.config (akan otomatis di-load)
          ./build/ckbuild.sh ginkgo -x

      - name: Kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-Nethunter
          path: |
            kernel/build/Floppy_*.zip
            ${{ github.workspace }}/Floppy_*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Log ve kullanilan config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-config
          path: |
            kernel/log.txt
            kernel/out/.config
          if-no-files-found: warn
          retention-days: 7
