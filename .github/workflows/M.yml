name: Build XXKSU-SUSFS Kernel

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Kernel (XXKSU-SUSFS)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Timezone
        run: |
          sudo rm /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime          

      - name: Install Build Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y && sudo apt-get update
          sudo apt-get install flex bison ncurses-dev texinfo gcc gperf patch libtool automake g++ libncurses5-dev gawk subversion expat libexpat1-dev python-all-dev binutils-dev bc libcap-dev autoconf libgmp-dev build-essential pkg-config libmpc-dev libmpfr-dev autopoint gettext txt2man liblzma-dev libssl-dev libz-dev mercurial wget tar zstd --fix-broken --fix-missing
          
      - name: Setup Cache (ccache & toolchains)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            toolchains
          key: ${{ runner.os }}-kernel-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-build-

      - name: Configure Telegram Secrets
        env:
          TG_BOT_TOKEN: 8691384652:AAHbKtOpbMp-Kc9JvKyil4aPsMfo5hdA-F8
          TG_CHAT_ID: -5173179904
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            echo "$TG_BOT_TOKEN" > ../bot_token
            echo "$TG_CHAT_ID" > ../chat_test
          fi

      - name: Compile Kernel
        run: |
          # Set toolchain type to aosp (the script will download it automatically)
          export CLANG_TYPE=greenforce
          # Set WP (workspace path) to the current directory (inside workspace for caching)
          export WP=$(pwd)
          
          # Configure ccache parameters for optimal size (10GB)
          ccache -M 10G
          
          # Run the build script for unified mitrinket target with the 'k' (KerneSU-Next-SUSFS) option
          # Also add 't' flag for Telegram upload if credentials are provided
          if [ -f ../bot_token ]; then
            ./do_build.sh mitrinket xt
          else
            ./do_build.sh mitrinket x
          fi

      - name: Unpack Flashable Zip
        run: |
          mkdir -p build/unpacked
          unzip build/Floppy_*.zip -d build/unpacked

      - name: Upload Kernel Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: FloppyKernel-XXKSU-SUSFS-mitrinket
          path: build/unpacked/
